name: ci

on:
  push:
  pull_request:

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # CPU torch + transformers only. coremltools is intentionally absent:
      # the Core ML tier skips via pytest.importorskip and no .mlpackage is
      # ever downloaded or exported here - macOS/ANE validation stays manual.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4" "transformers>=4.48" numpy pytest

      - name: Syntax and import check
        run: |
          python -m py_compile *.py tests/*.py
          python -c "import engine, coreml_worker, decide, benchmark_jev_competition"

      - name: Worker protocol tests (fake worker - no Core ML, no ANE)
        run: python -m pytest tests/test_worker.py -k "not real" -q

      - name: Pure-torch math equivalence tests
        run: >-
          python -m pytest tests/test_coreml_parity.py
          -k "linear_before_after or grouped_softmax" -q
